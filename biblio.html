<p> His Excellency Paul Biya was born on the  13 February 1933 at Mvoméka'a,Meyomessala Subdivision,Dja-et-Lobo Division,South Province.President Paul Biya is the second President of the State of Cameroon. He assumed office on the 6 November 1982 following the resignation of President Ahmadou Ahidjo.President Paul Biya is married and has three children.</p>
<p> Born on the 13th February 1933 at Mvoméka'a (Meyomessala) of the late Etienne Mvondo Assam and Mrs MVONDO(born Anastasie Eyenga Elle).</p>
<p><b> University Education :</b> <br> Degree in Public Law,Diploma of the Institut d'Etudes Politiques,Diploma from the Institut des Hautes Etudes d'Outre-Mer.Diplôme d'Etudes Superieurs in Public Law</p>
